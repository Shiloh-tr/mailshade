<!doctype html>
<html>
<head>
  <meta name="viewport" content="width=device-width">
  <style>
    body{margin:0;background:#070910;font-family:Arial,sans-serif;color:#f7f9ff}
    .shell{width:100%;padding:8px;background:#070910}
    .card{width:100%;max-width:580px;background:#10131d;border-collapse:separate;border-spacing:5px}
    .title{padding:12px;background:linear-gradient(120deg,#090a0f,#272052 48%,#5d213b);color:#ffffff;font-size:16px;font-weight:bold}
    .cell{height:48px;padding:8px;font-size:11px;font-weight:bold;vertical-align:middle;border-radius:8px}
  </style>
</head>
<body>
  <table role="presentation" class="shell" cellpadding="0" cellspacing="0"><tr><td align="center">
    <table role="presentation" class="card" cellpadding="0" cellspacing="5">
      <tr><td class="title" colspan="2">DARK HOLDOUT 2 / GRADIENTS + MIXED SURFACES</td></tr>
      <tr>
        <td class="cell" style="background:#090a0f;color:#ffffff">D1 near-black solid</td>
        <td class="cell" style="background:#202633;color:#dfe7ff">D2 charcoal solid</td>
      </tr>
      <tr>
        <td class="cell" style="background:linear-gradient(90deg,#05070c,#263459);color:#ffffff">D3 dark linear</td>
        <td class="cell" style="background:radial-gradient(circle at 80% 20%,#5b2dff 0,#151827 62%);color:#ffffff">D4 dark radial</td>
      </tr>
      <tr>
        <td class="cell" style="background:#0c111b;background-image:linear-gradient(135deg,rgba(255,114,71,.4),transparent 60%);color:#ffffff">D5 alpha gradient</td>
        <td class="cell" style="background-image:repeating-linear-gradient(135deg,#121622 0 8px,#1b2435 8px 16px);color:#ffffff">D6 repeating dark</td>
      </tr>
      <tr>
        <td class="cell" style="background:#fff4c2;color:#111111">D7 light notice inside dark</td>
        <td class="cell" style="background:#78f0bd;color:#07110d">D8 bright CTA inside dark</td>
      </tr>
      <tr>
        <td class="cell" style="background:#5b2dff;color:#ffffff;border:4px solid #bca8ff">D9 saturated dark card</td>
        <td class="cell" style="background:#111111;color:#ffffff;box-shadow:inset 0 0 0 7px rgba(255,255,255,.22)">D10 alpha inner ring</td>
      </tr>
    </table>
  </td></tr></table>
</body>
</html>
