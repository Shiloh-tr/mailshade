<!doctype html>
<html>
<head>
  <meta name="viewport" content="width=device-width">
  <style>
    body{margin:0;background:#eef1f6;font-family:Arial,sans-serif;color:#111111}
    .shell{width:100%;padding:8px;background:#eef1f6}.card{width:100%;max-width:580px;border-spacing:4px;background:#ffffff}
    .title{padding:10px;background:#20242d;color:#ffffff;font-size:15px;font-weight:bold}.cell{height:44px;padding:7px;font-size:11px;font-weight:bold;vertical-align:middle}
    .light{background:#ffffff}.dark{background:#111827}.green{color:#0a5a38}.purple{color:#7455d2}.teal{color:#075985}.magenta{color:#86198f}.rust{color:#9a3412}
    a{color:#0a5a38}.current{color:#0a5a38;border:5px solid currentColor;background:#fff4c2}
  </style>
</head>
<body><table role="presentation" class="shell" cellpadding="0" cellspacing="0"><tr><td align="center"><table role="presentation" class="card" cellpadding="0" cellspacing="4">
  <tr><td class="title" colspan="2">HOLDOUT E / CHROMATIC ROLES</td></tr>
  <tr><td class="cell light green">E1 green text / light</td><td class="cell dark green">E2 green text / dark</td></tr>
  <tr><td class="cell light purple">E3 purple text / light</td><td class="cell dark purple">E4 purple text / dark</td></tr>
  <tr><td class="cell light teal">E5 unseen teal text</td><td class="cell dark magenta">E6 unseen magenta text</td></tr>
  <tr><td class="cell light rust">E7 unseen rust text</td><td class="cell current">E8 currentColor border</td></tr>
  <tr><td class="cell light"><a href="https://example.com">E9 href link</a></td><td class="cell light"><a>E10 anchor no href</a></td></tr>
</table></td></tr></table></body>
</html>
