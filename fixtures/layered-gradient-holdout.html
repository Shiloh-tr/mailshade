<!doctype html>
<html>
<head>
  <meta name="viewport" content="width=device-width">
  <style>
    body{margin:0;background:#eef1f6;font-family:Arial,sans-serif}.shell{width:100%;padding:8px;background:#eef1f6}.card{width:100%;max-width:580px;border-spacing:4px;background:#ffffff}
    .title{padding:10px;background:#20242d;color:#ffffff;font-size:15px;font-weight:bold}.cell{height:48px;padding:7px;font-size:11px;font-weight:bold;vertical-align:middle}
  </style>
</head>
<body><table role="presentation" class="shell" cellpadding="0" cellspacing="0"><tr><td align="center"><table role="presentation" class="card" cellpadding="0" cellspacing="4">
  <tr><td class="title" colspan="2">HOLDOUT F / LAYERED GRADIENTS</td></tr>
  <tr><td class="cell" style="background:#ffffff;background-image:linear-gradient(90deg,rgba(255,114,71,.35),rgba(91,45,255,.25));color:#111111">F1 light fallback + alpha</td><td class="cell" style="background:#0b1020;background-image:linear-gradient(90deg,rgba(255,114,71,.35),transparent);color:#ffffff">F2 dark fallback + alpha</td></tr>
  <tr><td class="cell" style="background:radial-gradient(circle at 20% 20%,#fff4c2 0 18%,#7657d6 46%,#111827 100%);color:#ffffff">F3 three-stop radial</td><td class="cell" style="background:repeating-linear-gradient(30deg,#ffffff 0 7px,#dce3f5 7px 14px);color:#111111">F4 pale repeating</td></tr>
  <tr><td class="cell" style="background:#111827;background-image:radial-gradient(circle at 80% 20%,rgba(120,240,189,.75),transparent 42%),linear-gradient(135deg,transparent,#5b2dff);color:#ffffff">F5 two gradient layers</td><td class="cell" style="background:linear-gradient(120deg,#07090d,#172038,#5d213b);color:#f4f7ff">F6 naturally dark</td></tr>
  <tr><td class="cell" style="background:#fff4c2;background-image:linear-gradient(to bottom right,transparent 48%,rgba(0,0,0,.28) 49% 51%,transparent 52%);color:#342806">F7 light nested line</td><td class="cell" style="background:#10131d;background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.08) 0 5px,transparent 5px 10px);color:#dfe7ff">F8 dark alpha stripes</td></tr>
</table></td></tr></table></body>
</html>
