<!doctype html>
<html>
<head>
  <meta name="viewport" content="width=device-width">
  <style>
    body{margin:0;background:#eef1f6;font-family:Arial,sans-serif}.shell{width:100%;padding:8px;background:#eef1f6}.card{width:100%;max-width:580px;border-spacing:4px;background:#ffffff}
    .title{padding:10px;background:#20242d;color:#ffffff;font-size:15px;font-weight:bold}.cell{height:44px;padding:7px;font-size:11px;font-weight:bold;vertical-align:middle}
    .parent-dark{color:#07110d}.parent-light{color:#ffffff}.green{background:#78f0bd}.yellow{background:#fff4c2}.forced{background:#7657d6!important;color:#ffffff!important}
  </style>
</head>
<body><table role="presentation" class="shell" cellpadding="0" cellspacing="0"><tr><td align="center"><table role="presentation" class="card" cellpadding="0" cellspacing="4">
  <tr><td class="title" colspan="2">HOLDOUT G / LEGACY + INHERITANCE</td></tr>
  <tr class="parent-dark"><td class="cell green">G1 inherited dark</td><td class="cell yellow">G2 inherited dark yellow</td></tr>
  <tr class="parent-light"><td class="cell green">G3 inherited light</td><td class="cell yellow">G4 inherited light yellow</td></tr>
  <tr><td class="cell" bgcolor="#78f0bd"><font color="#07110d">G5 bgcolor + font</font></td><td class="cell forced" style="background:#fff4c2;color:#111111">G6 important class</td></tr>
  <tr><td class="cell" style="background:transparent;color:#111111;outline:4px solid #7657d6">G7 transparent outline</td><td class="cell" style="background:#111111;color:#ffffff;opacity:.45">G8 element opacity</td></tr>
  <tr><td class="cell green"><span style="color:#07110d">G9 nested dark child</span></td><td class="cell green"><span style="color:#ffffff">G10 nested light child</span></td></tr>
</table></td></tr></table></body>
</html>
